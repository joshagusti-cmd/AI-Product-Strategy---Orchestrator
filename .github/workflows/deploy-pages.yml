name: Deploy prototype to GitHub Pages

# Publishes 01-the-bet/prototype/ (the clickable Aiven Orchestrator demo) to
# GitHub Pages so it's reachable at a URL, not just viewable as source.
#
# One-time setup this workflow can't do for you: in the repo's
# Settings -> Pages, set "Build and deployment: Source" to "GitHub Actions".
# Once that's set, every push to main that touches the prototype redeploys it.

on:
  push:
    branches: [main]
    paths:
      - "01-the-bet/prototype/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload prototype as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 01-the-bet/prototype

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
